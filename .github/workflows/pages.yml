name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PARQDB_REVISION: 19a3cb1fcbeeacee20d45dc1dace5cc710b47057
  TRANSFORMERS_JS_VERSION: 2.17.2

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out demo source
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false

      - name: Check out pinned ParqDB source
        uses: actions/checkout@v4
        with:
          repository: parqdb-io/parqdb
          ref: ${{ env.PARQDB_REVISION }}
          path: parqdb
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parqdb/browser/package-lock.json

      - name: Install browser dependencies
        working-directory: parqdb/browser
        run: |
          npm ci
          npm install --no-save --package-lock=false "@xenova/transformers@${TRANSFORMERS_JS_VERSION}"

      - name: Install local ONNX Runtime Web assets
        run: |
          mkdir -p site/public/ort
          cp parqdb/browser/node_modules/onnxruntime-web/dist/*.wasm site/public/ort/
          ln -s ../parqdb/browser/node_modules site/node_modules

      - name: Build WebAssembly kernel
        working-directory: parqdb
        run: cargo build --locked --release --target wasm32-unknown-unknown -p parqdb-browser-kernels

      - name: Test browser client
        working-directory: parqdb/browser
        run: npm test

      - name: Build Pages artifact
        env:
          PARQDB_ROOT: ${{ github.workspace }}/parqdb
        run: node parqdb/browser/node_modules/vite/bin/vite.js build --config site/vite.config.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
