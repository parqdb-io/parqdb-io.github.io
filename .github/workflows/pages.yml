name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PARQDB_REVISION: 8e1950cad20bff918ba6d4ddbefa26b1bac99cc6

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out demo source
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false

      - name: Check out pinned ParqDB source
        uses: actions/checkout@v4
        with:
          repository: parqdb-io/parqdb
          ref: ${{ env.PARQDB_REVISION }}
          path: parqdb
          persist-credentials: false

      - name: Install demo entry point
        run: cp site/index.html parqdb/browser/demo/index.html

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parqdb/browser/package-lock.json

      - name: Install browser dependencies
        working-directory: parqdb/browser
        run: npm ci

      - name: Build WebAssembly kernel
        working-directory: parqdb
        run: cargo build --locked --release --target wasm32-unknown-unknown -p parqdb-browser-kernels

      - name: Test browser client
        working-directory: parqdb/browser
        run: npm test

      - name: Build Pages artifact
        working-directory: parqdb/browser
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: parqdb/browser/pages-dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
